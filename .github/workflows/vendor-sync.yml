name: Vendor sync

# docs/avatar_core.js 는 talking-drawing-avatar 의 사본이라 그쪽이 바뀌면 조용히 뒤처진다.
# 실제로 한 번 그렇게 벌어졌다(2026-07-31). push 때만 보면 원본만 바뀐 날은 못 잡으므로
# 매일 한 번도 돌린다. Verify 와 분리해 둔 이유: 이 빨간불은 "우리 코드가 깨졌다"가 아니라
# "원본을 따라가야 한다" 하나만 뜻해야 한다.

on:
  # paths 를 거는 이유: 이 검사는 원본이 움직이면 빨개지는데, 그건 PR 작성자가 고칠 수 없는
  # 이유다. 무관한 PR 까지 빨갛게 만들면 위에 적은 "빨간불의 뜻은 하나" 원칙을 스스로 어긴다.
  # 시간 경과로 생기는 드리프트는 아래 cron 이 24시간 안에 잡는다.
  # pull_request 는 넣지 않는다 — push 가 PR 브랜치에도 걸려 같은 커밋을 두 번 돌린다.
  push:
    paths:
      - docs/avatar_core.js
      - scripts/sync_avatar_core.sh
      - .github/workflows/vendor-sync.yml
  # 이 리포가 놀고 있을 때 원본만 바뀌는 경우를 잡는 유일한 트리거다.
  # 주의: 공개 리포의 schedule 은 저장소 활동이 60일간 없으면 자동 비활성화된다.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avatar-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/avatar_core.js 가 원본과 같은지 확인
        # HOME/face 가 없으므로 스크립트가 GitHub raw 로 폴백한다.
        run: ./scripts/sync_avatar_core.sh --check
