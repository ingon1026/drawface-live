name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 서브모듈까지 받는 이유: 아래 벤더 패치 검사가 third_party/FasterLivePortrait 를 필요로 한다.
      - uses: actions/checkout@v4
        with:
          submodules: true
      # 벤더 패치가 고정 SHA 에 여전히 붙는지. 이 빨간불은 "이 리포가 내부적으로 모순"이라는 뜻이라
      # (원본이 움직여서가 아니라 우리가 패치나 gitlink 를 건드려서만 깨진다) Vendor sync 가 아니라
      # 여기 소속이다.
      - name: 벤더 패치가 서브모듈에 적용 가능한지
        run: ./scripts/apply_vendor_patches.sh --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Install command-line tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python --requirement requirements.txt
      - name: Python tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. .venv/bin/python -m pytest -q tests
      - name: JavaScript syntax
        run: rg --files docs/js -g '*.js' | sort | xargs -r -n1 node --check
      - name: Browser E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Static asset cache graph
        run: bash scripts/check_web_asset_versions.sh
      - name: Whitespace errors
        run: git diff --check
