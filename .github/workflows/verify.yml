name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Install command-line tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python --requirement requirements.txt
      - name: Python tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. .venv/bin/python -m pytest -q tests
      - name: JavaScript syntax
        run: rg --files docs/js -g '*.js' | sort | xargs -r -n1 node --check
      - name: Browser E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Static asset cache graph
        run: bash scripts/check_web_asset_versions.sh
      - name: Whitespace errors
        run: git diff --check
